name: ffpack-noble

# Builds the noble variant of the FFmpeg v4l2-request pack (glibc 2.39 instead of
# trixie's 2.41) and uploads it next to the trixie pack in the
# ffmpeg-v4l2-request-v1 release.
#
# The source tarball and the build script are taken from the published trixie
# pack, so both packs come from the same sources with the same configure flags;
# only the glibc they are linked against differs. Runs natively on arm64 so no
# cross compiler is involved.
on:
  workflow_dispatch:
  push:
    branches:
      - ffpack-noble-run

permissions:
  contents: write

jobs:
  pack:
    # Native arm64 runner on Ubuntu 24.04 = noble = glibc 2.39.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Fetch the source pack
        run: |
          curl -fsSL --retry 5 --retry-delay 5 -o pack.tar.gz \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/ffmpeg-v4l2-request-v1/ffmpeg-v4l2-request-pack.tar.gz"
          tar xzf pack.tar.gz

      - name: Build FFmpeg against noble glibc
        run: sudo ./ffmpeg-v4l2-request-pack/scripts/build-from-source.sh

      - name: Assemble the noble pack
        run: |
          set -euo pipefail
          cd ffmpeg-v4l2-request-pack
          install -m 755 /opt/ffmpeg-v4l2/bin/ffmpeg bin/ffmpeg
          install -m 755 /opt/ffmpeg-v4l2/bin/ffprobe bin/ffprobe
          sed -i 's/glibc 2\.41/glibc 2.39/g; s/glibc < 2\.41/glibc < 2.38/g; s/Debian trixie/Ubuntu noble/g' \
            README-BUILD.md scripts/install-prebuilt.sh
          sha256sum src/kwiboo-ffmpeg-v4l2-request-n8.1.tgz bin/ffmpeg bin/ffprobe > SHA256SUMS
          cd ..
          tar czf ffmpeg-v4l2-request-pack-noble.tar.gz ffmpeg-v4l2-request-pack
          echo "--- pack sha256 ---"
          sha256sum ffmpeg-v4l2-request-pack-noble.tar.gz
          echo "--- highest glibc symbol ---"
          objdump -T ffmpeg-v4l2-request-pack/bin/ffmpeg | grep -o 'GLIBC_[0-9.]*' | sort -Vu | tail -1
          echo "--- hwaccels ---"
          ffmpeg-v4l2-request-pack/bin/ffmpeg -hwaccels

      - name: Publish the asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set +e
          gh release upload ffmpeg-v4l2-request-v1 ffmpeg-v4l2-request-pack-noble.tar.gz \
            --clobber --repo "${GITHUB_REPOSITORY}" > upload.log 2>&1
          rc=$?
          set -e
          cat upload.log

          # Actions logs are not reachable from the build host; keep the outcome on a
          # branch so it can be read through the API either way.
          { echo "exit=${rc}"; cat upload.log; } > "${RUNNER_TEMP}/diag.txt"
          cd "${RUNNER_TEMP}" && mkdir -p diag && cp diag.txt diag/ && cd diag
          git init -q -b diag
          git add diag.txt
          git -c user.name=ci -c user.email=ci@localhost commit -qm "ci diagnostics" || true
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/ffpack-noble-diag || true

          exit "${rc}"
